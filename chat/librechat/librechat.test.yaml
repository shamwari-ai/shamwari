# Test-only configuration, used with the stub gateway in CI. The only place a
# personal-scope endpoint may exist (docs/librechat.md). Never deployed.
version: 1.3.17
cache: true

interface:
  modelSelect: false
  parameters: false
  fileSearch: false
  prompts:
    use: false
  marketplace:
    use: false
  agents:
    use: false
    create: false
    share: false
    public: false

endpoints:
  # LibreChat refuses private addresses unless listed. Test only: the stub gateway.
  allowedAddresses: ['127.0.0.1:8787']
  custom:
    - name: 'Shamwari'
      apiKey: '${SHAMWARI_CHAT_PLACEHOLDER_KEY}'
      baseURL: 'http://127.0.0.1:8787/v1'
      models:
        default: ['shamwari-economy']
        fetch: false
      titleConvo: false
      dropParams: ['user']
      addParams:
        scope: 'platform'
        stream: false
        streaming: false
        disableStreaming: true
      headers:
        X-Shamwari-Channel: 'pwa'
    - name: 'Shamwari (personal)'
      apiKey: '${SHAMWARI_CHAT_PLACEHOLDER_KEY}'
      baseURL: 'http://127.0.0.1:8787/v1'
      models:
        default: ['shamwari-economy']
        fetch: false
      titleConvo: false
      dropParams: ['user']
      addParams:
        scope: 'personal'
        stream: false
        streaming: false
        disableStreaming: true
      headers:
        X-Shamwari-Channel: 'pwa'
