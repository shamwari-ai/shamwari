# Dependabot opens its PRs against main, the only integration branch (staging
# was retired). To keep the number of open PRs small, each ecosystem's updates
# come grouped: one PR for every minor and patch bump, and one for the majors,
# which need deliberate work (see #353). Version updates wait 7 days after a
# release (cooldown), since a just-published package is the likeliest to be
# malicious or broken; the cooldown does not delay security updates, and
# security updates are not grouped, so each one arrives on its own.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /docs-site
      - /factory
      - /gateway
      - /mobile
      - /site
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-major:
        applies-to: version-updates
        update-types:
          - major

  # The factory image's base images are pinned by digest; this proposes the
  # updates. The OpenCode pin inside it is changed by hand, together with
  # factory/src/opencode.ts (its config shape follows the pinned release).
  - package-ecosystem: docker
    directory: /factory
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /core
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      pip-major:
        applies-to: version-updates
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
