name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - run: npm ci
        working-directory: gateway

      - name: Type check
        run: npm run typecheck
        working-directory: gateway

      # Covers the two rules in CLAUDE.md that must not be broken:
      # personal scope never resolves to a cloud destination, and the
      # premium tier stays licenseClass 'restricted'.
      - name: Unit tests
        run: npm test
        working-directory: gateway

  core:
    name: Core (imports, syntax)
    runs-on: ubuntu-latest
    env:
      # Core reads its configuration at import time and fails loudly on a
      # missing variable. Placeholders are enough to prove it imports —
      # neither Mongo nor Postgres is contacted until a request arrives.
      MONGODB_URI: mongodb://placeholder
      SUPABASE_DB_URL: postgresql://placeholder
      SHAMWARI_CORE_TOKEN: placeholder
      CF_ACCOUNT_ID: placeholder
      CF_API_TOKEN: placeholder
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: core

      - name: Import check
        run: python -c "import main, ingest_ground; print(main.app.title, main.app.version)"
        working-directory: core

  docs-site:
    name: Docs site (links, tokens, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No build step, so this is the whole suite: dead anchors, colours
      # with no base :root value, the size budget, and the open-weights
      # language rule.
      - name: Check
        run: node check.mjs
        working-directory: docs-site

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # The gitleaks/gitleaks-action wrapper now requires a paid licence
        # for org repos. The binary itself is MIT-licensed; we run it
        # directly so this scan stays free.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository
        run: gitleaks detect --source . --redact --no-banner --verbose
