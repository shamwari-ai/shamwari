name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in
    # the stack, and a filter of [main] silently gives every layer but the
    # bottom one zero checks — the failure looks like a green PR, which is
    # the worst shape for it to take.
    branches: [main, staging, "claude/**"]
  # Merge queue. A queued pull request is re-tested on a temporary
  # gh-readonly-queue/* branch, and that run only starts if the workflow
  # listens for this event. Without it every queued PR waits on checks that
  # never begin, which looks like a stuck queue rather than a missing trigger.
  merge_group:

# Every job only reads the repository. Least privilege for GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repository this change touches, so each job below runs only when its own code (or
  # something it depends on) changed. A job that is skipped reports as skipped, which satisfies a required
  # check, so a docs-only change does not wait for the Core image build or the browser tests. A change to
  # this file, or one that cannot be diffed (a new branch, a force push), runs everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.f.outputs.gateway }}
      chat_guard: ${{ steps.f.outputs.chat_guard }}
      core: ${{ steps.f.outputs.core }}
      docs_site: ${{ steps.f.outputs.docs_site }}
      site: ${{ steps.f.outputs.site }}
      app: ${{ steps.f.outputs.app }}
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          all=false
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            all=true
            files=""
          else
            files="$(git diff --name-only "$BASE" HEAD)"
          fi
          while IFS= read -r f; do [ -n "$f" ] && echo "changed: $f"; done <<< "$files"
          # Anything that changes how CI itself runs, runs everything.
          if echo "$files" | grep -qx '.github/workflows/ci.yml'; then all=true; fi
          hit() { # hit <extended regex over paths>
            if [ "$all" = true ] || echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi
          }
          {
            # The gateway's tests read some of the docs (the status and sign-in pages) and two files
            # from core/ (the usage-field list and main.py), so those count.
            echo "gateway=$(hit '^(gateway/|core/|docs/)')"
            echo "chat_guard=$(hit '^chat/')"
            # Core's end-to-end contract runs the gateway Worker against Core.
            echo "core=$(hit '^(core/|gateway/|scripts/|db/)')"
            echo "docs_site=$(hit '^docs-site/')"
            echo "site=$(hit '^(site/|docs/)')"
            echo "app=$(hit '^site/')"
            echo "mobile=$(hit '^mobile/')"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  gateway:
    name: Gateway (types, tests)
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - run: npm ci
        working-directory: gateway

      - name: Type check
        run: npm run typecheck
        working-directory: gateway

      # Covers the two rules in CLAUDE.md that must not be broken:
      # personal scope never resolves to a cloud destination, and the
      # premium tier stays licenseClass 'restricted'.
      - name: Unit tests
        run: npm test
        working-directory: gateway

  chat-guard:
    name: LibreChat guard (Rule 1)
    needs: changes
    if: needs.changes.outputs.chat_guard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat/librechat/package-lock.json

      - run: npm ci
        working-directory: chat/librechat

      # LibreChat may talk only to the gateway. This fails the build if any
      # endpoint points elsewhere, a provider key appears, registration is on, a
      # public port is added or the pin stops being an exact commit. Includes
      # mutation checks, so the guard cannot rot into a test that always passes.
      - name: Guard tests
        run: npm test
        working-directory: chat/librechat

  chat-e2e:
    name: LibreChat stub-gateway e2e
    needs: changes
    if: needs.changes.outputs.chat_guard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      # Builds LibreChat from the commit pinned in chat/librechat/PIN (the Shamwari
      # fork) and checks the checkout equals the pin before building.
      - name: Build the pinned image
        run: chat/librechat/build.sh shamwari-chat:ci

      # The whole stack runs on a network with no route out. Secrets are generated
      # for this run only and never written to a file.
      - name: Run LibreChat against the stub gateway
        run: |
          CREDS_KEY="$(openssl rand -hex 32)"
          CREDS_IV="$(openssl rand -hex 16)"
          JWT_SECRET="$(openssl rand -hex 32)"
          JWT_REFRESH_SECRET="$(openssl rand -hex 32)"
          export CREDS_KEY CREDS_IV JWT_SECRET JWT_REFRESH_SECRET
          docker compose -f chat/librechat/e2e/compose.yml up \
            --abort-on-container-exit --exit-code-from driver

      - name: Logs on failure
        if: failure()
        run: docker compose -f chat/librechat/e2e/compose.yml logs --no-color --tail 200 || true

      - name: Tear down
        if: always()
        run: docker compose -f chat/librechat/e2e/compose.yml down -v || true

  core:
    name: Core (imports, syntax)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      # Core reads its configuration at import time and fails loudly on a
      # missing variable. Placeholders are enough to prove it imports —
      # the data API is not contacted until a request arrives.
      SHAMWARI_CORE_TOKEN: placeholder
      NYUCHI_API_INTERNAL_KEY: nyk_placeholder.nys_placeholder
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/requirements.txt

      # Offline and deterministic: asserts the lock still pins everything
      # requirements.in names, and that it carries hashes. Runs before the
      # install so a stale lock is named as such rather than surfacing as a
      # confusing ImportError further down.
      - name: Lockfile matches spec
        run: python check_lock.py
        working-directory: core

      # --require-hashes is redundant while every line has a hash, and it is
      # here so that a line WITHOUT one fails the install instead of quietly
      # dropping hash enforcement for the whole file.
      - run: pip install --require-hashes -r requirements.txt
        working-directory: core

      - name: Import check
        run: python -c "import main, ingest_ground; print(main.app.title, main.app.version)"
        working-directory: core

      # Spill replay: no loss, no duplicates, nothing but the allowlist leaves.
      - name: Replay tests
        run: python -m unittest -v
        working-directory: core

      # The first build of this image used to be Fly's remote builder on deploy
      # day. Building it here means a Dockerfile or lock problem fails a PR.
      - name: Image builds
        run: docker build -t shamwari-core:ci core

      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id shamwari-core:ci -u)" = "10001"

      # Placeholders only: Core connects to nothing until a request arrives.
      - name: Image imports Core
        run: >
          docker run --rm
          -e SHAMWARI_CORE_TOKEN=placeholder
          -e NYUCHI_API_INTERNAL_KEY=nyk_placeholder.nys_placeholder
          --entrypoint python shamwari-core:ci
          -c "import main; print(main.app.title, main.app.version)"

      # Retrieval has to keep putting the right section in front of the model. This
      # runs on the synthetic fixture, so it gates the harness and the chunker; the
      # real corpus is scored by hand (docs/ground-ingest.md).
      - name: Ground citation evaluation (offline)
        run: |
          python eval_ground.py --verify-labels --fixture
          python eval_ground.py --fixture --min-hit-at-k 1.0 --min-hit-at-1 0.85
        working-directory: core

      # The real Worker code against a real Core process (Core's own app over an
      # in-memory store holding the fixture corpus), with a fake model. Proves a
      # question comes back cited, that a personal-scope request reaches no provider,
      # embedder or store, and that provenance is stamped from the model that served.
      # Uses the Node the runner image ships; no new action.
      - name: End-to-end contract (Worker, Core, Ground)
        run: |
          (cd gateway && npm ci)
          PYTHON=python bash scripts/e2e.sh

  docs-site:
    name: Docs site (build, links, tokens, size)
    needs: changes
    if: needs.changes.outputs.docs_site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
        working-directory: docs-site

      - name: Build
        run: npm run build
        working-directory: docs-site

      # astro check covers types and MDX. check.mjs covers what it cannot:
      # dead links and assets, colours with no base :root value, stray
      # client JS, the size budget, and the open-weights language rule.
      - name: Check
        run: npm run check
        working-directory: docs-site

  # Two Workers, two origins, built and tested independently:
  #   site  -> shamwari-site, the marketing site on https://www.shamwari.ai
  #   app   -> shamwari-app, Shamwari Chat on https://shamwari.ai/chat/
  # Neither may contain the other's pages (check.mjs fails the build if it does).
  site:
    # Name kept as it was, so a required-status rule on it keeps working.
    name: Landing page (build, links, tokens, size)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      # astro check covers types. check.mjs covers what it cannot: dead
      # anchors and assets, colours with no base :root value, stray client
      # JS, no app files, canonical and sitemap on www, the size budget, and
      # the language-discipline rules.
      - name: Check
        run: npm run check
        working-directory: site

      # The guard that keeps Shamwari Chat from being called Live without
      # evidence, and the marketing links.
      - name: Unit tests
        run: npm run test:site
        working-directory: site

  app:
    name: Chat app (build, check, unit, e2e)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - name: Build
        run: npm run build:app
        working-directory: site

      # The installable shell and the budgets: manifest, service worker,
      # headers and CSP, the 100 KB JS and 50 KB first-load limits, the
      # root redirect, and nothing but the chat page.
      - name: Check
        run: npm run check:app
        working-directory: site

      # Chat client against the gateway mock, the strings, the sign-in providers.
      - name: Unit tests
        run: npm run test:app
        working-directory: site

      # End to end against the gateway mock, in a 360 px Android viewport:
      # asks and citations, the personal-scope explanation, honest errors,
      # local-only history, offline queue, axe, and the Mukoko sign-in (flag
      # on, against a stand-in for the session Worker). It builds its own
      # copies of the app (dist-e2e/) pointed at the mock.
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: site

      - name: End-to-end tests
        run: npm run e2e
        working-directory: site

  mobile:
    name: Mobile (types, tests)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      - run: npm run typecheck
        working-directory: mobile

      - run: npm test
        working-directory: mobile

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # The gitleaks/gitleaks-action wrapper now requires a paid licence
        # for org repos. The binary itself is MIT-licensed; we run it
        # directly so this scan stays free.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository
        run: gitleaks detect --source . --redact --no-banner --verbose
