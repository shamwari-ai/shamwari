name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in
    # the stack, and a filter of [main] silently gives every layer but the
    # bottom one zero checks — the failure looks like a green PR, which is
    # the worst shape for it to take.
    branches: [main, staging, "claude/**"]
  # Merge queue. A queued pull request is re-tested on a temporary
  # gh-readonly-queue/* branch, and that run only starts if the workflow
  # listens for this event. Without it every queued PR waits on checks that
  # never begin, which looks like a stuck queue rather than a missing trigger.
  merge_group:

# Every job only reads the repository. Least privilege for GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - run: npm ci
        working-directory: gateway

      - name: Type check
        run: npm run typecheck
        working-directory: gateway

      # Covers the two rules in CLAUDE.md that must not be broken:
      # personal scope never resolves to a cloud destination, and the
      # premium tier stays licenseClass 'restricted'.
      - name: Unit tests
        run: npm test
        working-directory: gateway

  core:
    name: Core (imports, syntax)
    runs-on: ubuntu-latest
    env:
      # Core reads its configuration at import time and fails loudly on a
      # missing variable. Placeholders are enough to prove it imports —
      # the data API is not contacted until a request arrives.
      SHAMWARI_CORE_TOKEN: placeholder
      NYUCHI_API_INTERNAL_KEY: nyk_placeholder.nys_placeholder
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/requirements.txt

      # Offline and deterministic: asserts the lock still pins everything
      # requirements.in names, and that it carries hashes. Runs before the
      # install so a stale lock is named as such rather than surfacing as a
      # confusing ImportError further down.
      - name: Lockfile matches spec
        run: python check_lock.py
        working-directory: core

      # --require-hashes is redundant while every line has a hash, and it is
      # here so that a line WITHOUT one fails the install instead of quietly
      # dropping hash enforcement for the whole file.
      - run: pip install --require-hashes -r requirements.txt
        working-directory: core

      - name: Import check
        run: python -c "import main, ingest_ground; print(main.app.title, main.app.version)"
        working-directory: core

      # Spill replay: no loss, no duplicates, nothing but the allowlist leaves.
      - name: Replay tests
        run: python -m unittest -v
        working-directory: core

      # The first build of this image used to be Fly's remote builder on deploy
      # day. Building it here means a Dockerfile or lock problem fails a PR.
      - name: Image builds
        run: docker build -t shamwari-core:ci core

      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id shamwari-core:ci -u)" = "10001"

      # Placeholders only: Core connects to nothing until a request arrives.
      - name: Image imports Core
        run: >
          docker run --rm
          -e SHAMWARI_CORE_TOKEN=placeholder
          -e NYUCHI_API_INTERNAL_KEY=nyk_placeholder.nys_placeholder
          --entrypoint python shamwari-core:ci
          -c "import main; print(main.app.title, main.app.version)"

      # Retrieval has to keep putting the right section in front of the model. This
      # runs on the synthetic fixture, so it gates the harness and the chunker; the
      # real corpus is scored by hand (docs/ground-ingest.md).
      - name: Ground citation evaluation (offline)
        run: |
          python eval_ground.py --verify-labels --fixture
          python eval_ground.py --fixture --min-hit-at-k 1.0 --min-hit-at-1 0.85
        working-directory: core

      # The real Worker code against a real Core process (Core's own app over an
      # in-memory store holding the fixture corpus), with a fake model. Proves a
      # question comes back cited, that a personal-scope request reaches no provider,
      # embedder or store, and that provenance is stamped from the model that served.
      # Uses the Node the runner image ships; no new action.
      - name: End-to-end contract (Worker, Core, Ground)
        run: |
          (cd gateway && npm ci)
          PYTHON=python bash scripts/e2e.sh

  docs-site:
    name: Docs site (build, links, tokens, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
        working-directory: docs-site

      - name: Build
        run: npm run build
        working-directory: docs-site

      # astro check covers types and MDX. check.mjs covers what it cannot:
      # dead links and assets, colours with no base :root value, stray
      # client JS, the size budget, and the open-weights language rule.
      - name: Check
        run: npm run check
        working-directory: docs-site

  site:
    name: Landing page (build, links, tokens, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      # astro check covers types. check.mjs covers what it cannot: dead
      # anchors and assets, colours with no base :root value, stray client
      # JS, the size budget, and the language-discipline rules.
      - name: Check
        run: npm run check
        working-directory: site

      # Chat client against the gateway mock, the strings, and the guard that
      # keeps Shamwari Chat from being called Live without evidence.
      - name: Unit tests
        run: npm test
        working-directory: site

      # End to end against the gateway mock, in a 360 px Android viewport:
      # asks and citations, the personal-scope explanation, honest errors,
      # local-only history, offline queue and axe. Builds its own copy of the
      # site (dist-e2e/) pointed at the mock; dist/ stays the production build.
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: site

      - name: End-to-end tests
        run: npm run e2e
        working-directory: site

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # The gitleaks/gitleaks-action wrapper now requires a paid licence
        # for org repos. The binary itself is MIT-licensed; we run it
        # directly so this scan stays free.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repository
        run: gitleaks detect --source . --redact --no-banner --verbose
