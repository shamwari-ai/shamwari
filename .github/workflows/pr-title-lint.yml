name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # The merge queue needs this check to report on its temporary branch too.
  # There is no pull request title to lint there (the title was already
  # checked on the PR, and a squash merge uses it as the commit subject), so
  # the job is skipped for this event. A skipped job satisfies a required
  # check.
  merge_group:

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Conventional Commits
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: false
          subjectPattern: ^(?![A-Z])[^.]+[^. ]$
          subjectPatternError: |
            PR title subject must start lowercase, use imperative mood,
            and not end with a period.
          wip: true
