# Shamwari Core: interim Python deploy. Replaced by the Rust origin behind a
# tunnel (issue #66); this is public HTTPS until then, and every route except
# /health requires the bearer token (SHAMWARI_CORE_TOKEN).
#
# Secrets are never in this file. Set them with `fly secrets set`:
#   MONGODB_URI  SUPABASE_DB_URL  SHAMWARI_CORE_TOKEN  CF_ACCOUNT_ID  CF_API_TOKEN
# Only when usage replay is switched on (docs/usage-replay.md):
#   SHAMWARI_OPS_TOKEN  SERVERS_API_URL  SERVERS_API_TOKEN  SERVERS_API_INTERNAL_KEY
app = "shamwari-core"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
