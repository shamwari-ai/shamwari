# Shamwari Core: interim Python deploy. Replaced by the Rust origin behind a
# tunnel (issue #66); this is public HTTPS until then, and every route except
# /health requires the bearer token (SHAMWARI_CORE_TOKEN).
#
# Secrets are never in this file. Set them with `fly secrets import` (stdin, so
# no value reaches argv or shell history); the full procedure is
# docs/core-fly-runbook.md. What the RUNNING service reads, and only this:
#   required   MONGODB_URI  SHAMWARI_CORE_TOKEN
#   operators  SHAMWARI_OPS_TOKEN   (unset = /replay/* and /rollup/by-tier answer 503)
#   replay     SERVERS_API_URL  SERVERS_API_TOKEN  SERVERS_API_INTERNAL_KEY
#              (only when usage replay is switched on: docs/usage-replay.md)
# SUPABASE_DB_URL, CF_ACCOUNT_ID and CF_API_TOKEN are read by ingest_ground.py ONLY.
# The ingest also needs a Mongo login (MONGODB_URI) in the operator's own shell; it is
# not Core's. Core does not read the other three while serving, and the ingest script
# is not in the image, so a Core that cannot be handed a Supabase login or a Cloudflare
# token cannot leak one. A test (test_deploy_config.py) fails if main.py starts reading
# them or the image starts shipping the script.
app = "shamwari-core"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
